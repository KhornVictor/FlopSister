# Somnang's part: Base Spring Boot application settings.
spring:
  application:
    name: "@project.name@"
  mvc:
    view:
      prefix: /WEB-INF/jsp/
      suffix: .jsp
  datasource:
    url: jdbc:h2:mem:shop;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always

shop:
  currency: USD
  tax-rate: 0.20
  low-stock-threshold: 5

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
  endpoint:
    health:
      show-details: always

info:
  app:
    name: "@project.name@"
    description: "@project.description@"
    version: "@project.version@"

logging:
  level:
    edu.itc.shop: DEBUG
    edu.itc.se.shop: DEBUG
    edu.itc.shop.service.TimingAspect: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{requestId:-no-request}] %logger{36} : %msg%n"

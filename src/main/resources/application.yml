spring:
  application:
    name: shop-secure
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:h2:mem:shop
  jpa:
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: false

shop:
  security:
    jwt-secret: ${JWT_SECRET}
    access-token-ttl: 15m
  seed:
    admin-password: ${SHOP_SEED_ADMIN_PASSWORD}
    customer-password: ${SHOP_SEED_CUSTOMER_PASSWORD}
